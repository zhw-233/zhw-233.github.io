name: Portfolio Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read Pages address
        if: github.event_name == 'workflow_dispatch'
        id: pages
        uses: actions/configure-pages@v6
      - name: Build and check internal links
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://preview.invalid' }}
          BASE_PATH: ${{ github.event_name != 'workflow_dispatch' && '/preview/' || steps.pages.outputs.base_path }}
      - name: Upload site for manual release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
