name: Portfolio Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read Pages address
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v6
      - name: Build and check internal links
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://preview.invalid' }}
          BASE_PATH: ${{ github.ref != 'refs/heads/main' && '/preview/' || steps.pages.outputs.base_path }}
      - name: Upload built site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
